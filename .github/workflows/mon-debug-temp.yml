name: DEBUG TEMP — diagnosticar mon-coleta

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Chamar mon-coleta e salvar resposta
        run: |
          set +e
          STATUS=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -X POST \
            --max-time 180 \
            "https://jvlreltjfubennbtjvyq.supabase.co/functions/v1/mon-coleta" \
            -H "Content-Type: application/json" \
            -H "x-mon-cron-secret: ${{ secrets.MON_CRON_SECRET }}" \
            -d '{"origem":"debug-temp"}')
          mkdir -p debug
          {
            echo "HTTP_STATUS=$STATUS"
            echo "---BODY---"
            cat /tmp/body.txt
          } > debug/mon-coleta-debug.txt
          cat debug/mon-coleta-debug.txt
      - name: Consultar estado_atual via REST (anon key)
        env:
          SUPA_URL: ${{ vars.SUPA_URL_UNUSED || '' }}
        run: |
          set +e
          source <(grep -E '^VITE_SUPABASE' .env | sed 's/^/export /')
          echo "== contagem por estado_atual ==" > debug/estado-atual.txt
          curl -sS "$VITE_SUPABASE_URL/rest/v1/mon_usinas?select=estado_atual" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" >> debug/estado-atual.txt
          echo "" >> debug/estado-atual.txt
          echo "== amostra de 8 usinas (id, marca, estado_atual, estado_atualizado_em) ==" >> debug/estado-atual.txt
          curl -sS "$VITE_SUPABASE_URL/rest/v1/mon_usinas?select=id,marca,estado_atual,estado_atualizado_em&limit=8" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" >> debug/estado-atual.txt
          echo "" >> debug/estado-atual.txt
          echo "== amostra de 10 leituras mais recentes (usina_id, coletado_em, potencia_w, online) ==" >> debug/estado-atual.txt
          curl -sS "$VITE_SUPABASE_URL/rest/v1/mon_leituras?select=usina_id,coletado_em,potencia_w,online&order=coletado_em.desc&limit=10" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" >> debug/estado-atual.txt
          cat debug/estado-atual.txt
      - name: Commitar resultado
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add debug/mon-coleta-debug.txt debug/estado-atual.txt
          git commit -m "debug: resposta do mon-coleta + estado_atual" || echo "nada pra commitar"
          git push
